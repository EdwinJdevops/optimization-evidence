name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: mypy src
      - run: pytest -q
      - name: Validate shell syntax
        run: bash -n scripts/exp001/run.sh
      - name: Shellcheck experiment runner
        run: shellcheck scripts/exp001/run.sh
      - name: Parse Kubernetes YAML
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          paths = sorted(Path("infra/k8s/exp001").glob("*.yaml"))
          assert paths, "no EXP-001 Kubernetes manifests found"
          for path in paths:
              docs = list(yaml.safe_load_all(path.read_text()))
              assert docs, f"{path}: no YAML documents"
              for index, doc in enumerate(docs, start=1):
                  assert isinstance(doc, dict), f"{path} document {index}: expected mapping"
                  assert doc.get("apiVersion"), f"{path} document {index}: missing apiVersion"
                  assert doc.get("kind"), f"{path} document {index}: missing kind"
          print(f"validated {len(paths)} manifest files")
          PY

      - name: Validate CodeBuild shell contract
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          text = Path("infra/aws/exp001-cluster.yaml").read_text()
          pattern = re.compile(
              r"BuildSpec:\s*\|\n"
              r"\s+version:\s*0\.2\n"
              r"\s+env:\n"
              r"\s+shell:\s+bash\n"
          )
          assert pattern.search(text), "EXP-001 CodeBuild buildspec must explicitly use bash"
          PY
