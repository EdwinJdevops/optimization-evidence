apiVersion: v1
kind: Namespace
metadata:
  name: optimization-evidence
  labels:
    app.kubernetes.io/part-of: optimization-evidence
    optimization-evidence/experiment: EXP-001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: exp001-app
  namespace: optimization-evidence
  labels:
    app: exp001-app
    optimization-evidence/experiment: EXP-001
spec:
  replicas: 4
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app: exp001-app
  template:
    metadata:
      labels:
        app: exp001-app
        optimization-evidence/experiment: EXP-001
        optimization-evidence/arm: baseline
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: exp001-app
      containers:
        - name: nginx
          image: nginx:1.29.1-alpine
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 700m
              memory: 512Mi
            limits:
              cpu: 900m
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: exp001-app
  namespace: optimization-evidence
  labels:
    optimization-evidence/experiment: EXP-001
spec:
  type: ClusterIP
  selector:
    app: exp001-app
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: exp001-app
  namespace: optimization-evidence
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: exp001-app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: exp001-loadgen
  namespace: optimization-evidence
  labels:
    app: exp001-loadgen
    optimization-evidence/experiment: EXP-001
spec:
  replicas: 1
  selector:
    matchLabels:
      app: exp001-loadgen
  template:
    metadata:
      labels:
        app: exp001-loadgen
        optimization-evidence/experiment: EXP-001
    spec:
      containers:
        - name: loadgen
          image: busybox:1.37.0
          command:
            - /bin/sh
            - -ec
            - |
              while true; do
                ts="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
                if wget -q -T 2 -O /dev/null http://exp001-app.optimization-evidence.svc.cluster.local/; then
                  echo "$ts status=ok"
                else
                  echo "$ts status=fail"
                fi
                sleep 1
              done
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
