AWSTemplateFormatVersion: '2010-09-09'
Description: Evidence substrate for optimization outcome experiments - CUR 2.0 hourly resource-level export to private S3.

Resources:
  EvidenceBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-research-evidence-after-180-days
            Status: Enabled
            ExpirationInDays: 180
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      Tags:
        - Key: Project
          Value: optimization-evidence
        - Key: Purpose
          Value: billing-evidence
        - Key: Environment
          Value: research

  EvidenceBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref EvidenceBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: EnableAWSDataExportsToWriteToS3
            Effect: Allow
            Principal:
              Service:
                - bcm-data-exports.amazonaws.com
            Action:
              - s3:PutObject
            Resource: !Sub '${EvidenceBucket.Arn}/*'
            Condition:
              ArnLike:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:bcm-data-exports:us-east-1:${AWS::AccountId}:export/*'
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  Cur2Export:
    Type: AWS::BCMDataExports::Export
    DependsOn: EvidenceBucketPolicy
    Properties:
      Export:
        Name: optimization-evidence-cur2
        Description: Hourly resource-level CUR 2.0 evidence for optimization outcome attribution experiments.
        DataQuery:
          QueryStatement: >-
            SELECT identity_line_item_id, identity_time_interval, bill_invoice_id, bill_invoicing_entity,
            bill_billing_entity, bill_bill_type, bill_payer_account_id, bill_payer_account_name,
            bill_billing_period_start_date, bill_billing_period_end_date, line_item_usage_account_id,
            line_item_usage_account_name, line_item_line_item_type, line_item_usage_start_date,
            line_item_usage_end_date, line_item_product_code, line_item_usage_type, line_item_operation,
            line_item_availability_zone, line_item_resource_id, line_item_usage_amount,
            line_item_normalization_factor, line_item_normalized_usage_amount, line_item_currency_code,
            line_item_unblended_rate, line_item_unblended_cost, line_item_user_identifier,
            line_item_blended_rate, line_item_blended_cost, line_item_line_item_description,
            line_item_tax_type, line_item_net_unblended_rate, line_item_net_unblended_cost,
            line_item_legal_entity, product_servicecode, product_operation, product_usagetype,
            product_sku, product_product_family, product_comment, product_fee_code,
            product_fee_description, product_location, product_location_type, product_region_code,
            product_from_location, product_from_location_type, product_from_region_code,
            product_to_location, product_to_location_type, product_to_region_code,
            product_instance_family, product_instance_type, product_instancesku, product_pricing_unit,
            product, pricing_lease_contract_length, pricing_offering_class, pricing_purchase_option,
            pricing_rate_code, pricing_rate_id, pricing_currency, pricing_public_on_demand_rate,
            pricing_public_on_demand_cost, pricing_term, pricing_unit, reservation_availability_zone,
            reservation_start_time, reservation_end_time, reservation_modification_status,
            reservation_amortized_upfront_cost_for_usage,
            reservation_amortized_upfront_fee_for_billing_period,
            reservation_unused_amortized_upfront_fee_for_billing_period,
            reservation_recurring_fee_for_usage, reservation_unused_recurring_fee,
            reservation_effective_cost, reservation_upfront_value,
            reservation_net_amortized_upfront_cost_for_usage,
            reservation_net_amortized_upfront_fee_for_billing_period,
            reservation_net_unused_amortized_upfront_fee_for_billing_period,
            reservation_net_recurring_fee_for_usage, reservation_net_unused_recurring_fee,
            reservation_net_effective_cost, reservation_net_upfront_value,
            reservation_normalized_units_per_reservation, reservation_number_of_reservations,
            reservation_reservation_a_r_n, reservation_subscription_id,
            reservation_total_reserved_normalized_units, reservation_total_reserved_units,
            reservation_units_per_reservation, reservation_unused_normalized_unit_quantity,
            reservation_unused_quantity, savings_plan_total_commitment_to_date,
            savings_plan_savings_plan_a_r_n, savings_plan_savings_plan_rate,
            savings_plan_used_commitment, savings_plan_savings_plan_effective_cost,
            savings_plan_amortized_upfront_commitment_for_billing_period,
            savings_plan_recurring_commitment_for_billing_period,
            savings_plan_net_savings_plan_effective_cost,
            savings_plan_net_amortized_upfront_commitment_for_billing_period,
            savings_plan_net_recurring_commitment_for_billing_period,
            savings_plan_start_time, savings_plan_end_time, savings_plan_instance_type_family,
            savings_plan_offering_type, savings_plan_payment_option, savings_plan_purchase_term,
            savings_plan_region, discount_bundled_discount, discount_total_discount, discount,
            resource_tags, tags, cost_category, capacity_reservation_capacity_reservation_arn,
            capacity_reservation_capacity_reservation_status, capacity_reservation_capacity_reservation_type
            FROM COST_AND_USAGE_REPORT
          TableConfigurations:
            COST_AND_USAGE_REPORT:
              TIME_GRANULARITY: HOURLY
              INCLUDE_RESOURCES: 'TRUE'
              INCLUDE_SPLIT_COST_ALLOCATION_DATA: 'FALSE'
              INCLUDE_CAPACITY_RESERVATION_DATA: 'TRUE'
              INCLUDE_IAM_PRINCIPAL_DATA: 'FALSE'
        DestinationConfigurations:
          S3Destination:
            S3Bucket: !Ref EvidenceBucket
            S3BucketOwner: !Ref AWS::AccountId
            S3Prefix: cur2
            S3Region: us-east-1
            S3OutputConfigurations:
              Compression: PARQUET
              Format: PARQUET
              OutputType: CUSTOM
              Overwrite: OVERWRITE_REPORT
        RefreshCadence:
          Frequency: SYNCHRONOUS
      Tags:
        - Key: Project
          Value: optimization-evidence
        - Key: Environment
          Value: research

Outputs:
  EvidenceBucketName:
    Value: !Ref EvidenceBucket
  Cur2ExportArn:
    Value: !GetAtt Cur2Export.ExportArn
